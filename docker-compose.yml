services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist index qua các lần restart — build_index.py chỉ chạy lại
      # khi volume này rỗng (xem entrypoint.sh)
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  frontend:
    build: .
    entrypoint: ["streamlit"]
    command: ["run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - API_URL=http://backend:8000/chat
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data: