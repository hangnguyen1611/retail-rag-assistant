services:
  backend:
    build: &build
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EMBEDDING_MODEL: intfloat/multilingual-e5-small
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - CORS_ALLOW_ORIGINS=http://localhost:8501,http://127.0.0.1:8501
    volumes:
      # Persist index qua các lần restart — build_index.py chỉ chạy lại
      # khi volume này rỗng (xem entrypoint.sh)
      - chroma_data:/app/chroma_db
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s

  frontend:
    build: *build
    entrypoint: ["streamlit"]
    command: ["run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data: