name: Unit tests

# Chạy khi push hoặc mở PR nhắm vào main. Chỉ trigger khi có thay đổi liên quan
# tới code (không chạy lại khi chỉ sửa README/data) để tiết kiệm CI minutes.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "conftest.py"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "conftest.py"
      - "requirements.txt"
      - ".github/workflows/test.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Cài riêng pytest + các dep nhẹ mà api/routers/chat.py cần khi import (fastapi và qua config/backend.py: numpy, python-dotenv)
      # thay vì `pip install -r requirements.txt`, vẫn tránh sentence-transformers/chromadb/groq
      # Nếu sau này thêm test cần Retriever/Generator thật, đổi dòng dưới thành: pip install -r requirements.txt pytest
      - name: Install dependencies
        run: pip install pytest "fastapi>=0.115,<1.0" numpy python-dotenv

      - name: Run unit tests
        run: pytest tests/ -v