name: Unit tests

# Chạy khi push hoặc mở PR nhắm vào main. Chỉ trigger khi có thay đổi liên quan
# tới code (không chạy lại khi chỉ sửa README/data) để tiết kiệm CI minutes.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "conftest.py"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "conftest.py"
      - "requirements.txt"
      - ".github/workflows/test.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Cài riêng pytest + fastapi thay vì `pip install -r requirements.txt`:
      # tests/test_query_filter.py chỉ test logic thuần Python (stdlib re), nhưng tests/test_chat_retrieve.py import từ api/routers/chat.py nên
      # cần fastapi (nhẹ). Vẫn tránh cài sentence-transformers/chromadb/groq (nặng, kéo theo torch, không cần thiết cho unit test).
      # Nếu sau này thêm test cần Retriever/Generator thật, đổi dòng dưới thành: pip install -r requirements.txt pytest
      - name: Install dependencies
        run: pip install pytest "fastapi>=0.115,<1.0"

      - name: Run unit tests
        run: pytest tests/ -v